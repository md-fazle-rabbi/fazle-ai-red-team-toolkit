# Rules of Engagement for self testing of the local stub target (see README's Stub
# target section). Copy this file into engagements/ (git-ignored) and edit it.
# Do not put secrets here. Credentials go in an environment variable; this file
# only names the variable, and the stub needs none.

schema_version = 1
engagement_id = "stub-local-selftest"
allowed_suites = ["prompt_injection", "image_prompt_injection", "jailbreak", "pii_leakage"]

[client]
name = "Fazle Rabbi (self test)"

[authorized_by]
name = "Fazle Rabbi"
role = "System owner"
email = "mfrabbi.ai@gmail.com"

[operator]
name = "Fazle Rabbi"
role = "Operator"
email = "mfrabbi.ai@gmail.com"

# Every date-time needs a UTC offset. The end is exclusive. The longest window is 31 days.
[window]
start = 2026-10-19T00:00:00+06:00
end = 2026-11-19T00:00:00+06:00

# The stub is local, synthetic and has no rate limit of its own, so these ceilings
# are only what the code allows, not a measured safe rate for anything real.
[limits]
requests_per_minute = 60
total_requests = 1000
concurrency = 5

# self_owned is allowed only when every target is local. A client system needs a
# signed_document with the SHA-256 of the signed file.
[authorization]
kind = "self_owned"
reference = "Own synthetic stub target, local machine only"

[stop_contact]
name = "Fazle Rabbi"
role = "Operator"
email = "mfrabbi.ai@gmail.com"

# Run one mode of the stub at a time on port 8010 (see README). Both targets point
# at the same address; which one you are actually talking to depends on whether
# you started weak_app or hardened_app.
[[targets]]
id = "stub-weak-local"
base_url = "http://127.0.0.1:8010"
allowed_paths = ["/query"]
environment = "local"
real_personal_data = false

[[targets]]
id = "stub-hardened-local"
base_url = "http://127.0.0.1:8010"
allowed_paths = ["/query"]
environment = "local"
real_personal_data = false
