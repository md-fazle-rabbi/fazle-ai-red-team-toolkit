# Rules of Engagement for sending probe images to the local stub's image upload
# endpoint (see README's Image probes section). Copy this file into engagements/
# (git-ignored) and edit it. Do not put secrets here. The stub needs no credentials.

schema_version = 1
engagement_id = "stub-image-selftest"
allowed_suites = ["image_prompt_injection"]

[client]
name = "Fazle Rabbi (self test)"

[authorized_by]
name = "Fazle Rabbi"
role = "System owner"
email = "mfrabbi.ai@gmail.com"

[operator]
name = "Fazle Rabbi"
role = "Operator"
email = "mfrabbi.ai@gmail.com"

# Every date-time needs a UTC offset. The end is exclusive. The longest window is 31 days.
[window]
start = 2026-10-25T00:00:00+06:00
end = 2026-11-25T00:00:00+06:00

# The stub is local, synthetic and has no rate limit of its own, so these ceilings
# are only what the code allows, not a measured safe rate for anything real.
[limits]
requests_per_minute = 600
total_requests = 1000
concurrency = 1

# self_owned is allowed only when every target is local.
[authorization]
kind = "self_owned"
reference = "Own synthetic stub target, local machine only"

[stop_contact]
name = "Fazle Rabbi"
role = "Operator"
email = "mfrabbi.ai@gmail.com"

# Run one mode of the stub at a time on port 8010. Both targets point at the same
# address; which one you are talking to depends on whether you started weak_app or
# hardened_app.
[[targets]]
id = "stub-weak-local"
base_url = "http://127.0.0.1:8010"
allowed_paths = ["/ingest/image"]
environment = "local"
real_personal_data = false

[[targets]]
id = "stub-hardened-local"
base_url = "http://127.0.0.1:8010"
allowed_paths = ["/ingest/image"]
environment = "local"
real_personal_data = false
