# Rules of Engagement for a load test of the local stub target. Copy this file into
# engagements/ (git-ignored) and edit it. It is self_owned, so it may ask for more
# requests than a client file can (see ADR-013). The ceilings are policy values, not
# measured safe rates for anything. Do not put secrets here.

schema_version = 1
engagement_id = "stub-load-selftest"
allowed_suites = ["load"]

[client]
name = "Fazle Rabbi (self test)"

[authorized_by]
name = "Fazle Rabbi"
role = "System owner"
email = "mfrabbi.ai@gmail.com"

[operator]
name = "Fazle Rabbi"
role = "Operator"
email = "mfrabbi.ai@gmail.com"

# Every date-time needs a UTC offset. The end is exclusive. The longest window is 31 days.
[window]
start = 2026-10-22T00:00:00+06:00
end = 2026-11-20T00:00:00+06:00

# Why the rate is this high: the budget spaces requests evenly at this rate. A lower
# rate would make simulated users queue behind the budget, and the load test would
# then measure the budget instead of the system.
[limits]
requests_per_minute = 60000
total_requests = 100000
concurrency = 50

[authorization]
kind = "self_owned"
reference = "Own synthetic stub target, local machine only"

[stop_contact]
name = "Fazle Rabbi"
role = "Operator"
email = "mfrabbi.ai@gmail.com"

# Run the weak stub on port 8010 (see README).
[[targets]]
id = "stub-weak-local"
base_url = "http://127.0.0.1:8010"
allowed_paths = ["/query"]
environment = "local"
real_personal_data = false
