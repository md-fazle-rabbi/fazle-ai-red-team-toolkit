version: 2

updates:
  # Why: every action in the workflows is pinned to a full commit. Dependabot keeps
  # those pins current and rewrites the version comment beside each one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Why: a release stays out of the proposals for a week, so a compromised release
    # that is pulled quickly never reaches a pull request here.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # Why: the project's own dependencies are locked in uv.lock. The heavy tools stay in
  # their own environments outside it and are not covered here.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"
