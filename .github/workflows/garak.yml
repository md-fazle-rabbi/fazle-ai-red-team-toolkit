name: Garak gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Why: least privilege by default, same as ci.yml.
permissions:
  contents: read

concurrency:
  group: garak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.21"
  PYTHON_VERSION: "3.13.15"
  # Why: garak goes into its own environment inside the job, not into uv.lock, so the
  # repository's dependency tree stays small. The version is the one used for the
  # local runs. Its metadata asks for torch 2.13.0 or newer.
  GARAK_VERSION: "0.17.1"
  TORCH_SPEC: "torch>=2.13.0"

jobs:
  garak:
    name: garak against the hardened stub
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        run: uv sync --locked

      # Why: the default torch wheel on Linux pulls the CUDA libraries, which are large
      # and useless here. The CPU build goes in first, so garak finds torch already
      # satisfied. The whole job took 1m 42s in one run on 2026-10-24.
      - name: Install garak in its own environment
        run: |
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/garak-env"
          uv pip install --python "$RUNNER_TEMP/garak-env/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu "$TORCH_SPEC"
          uv pip install --python "$RUNNER_TEMP/garak-env/bin/python" \
            "garak==$GARAK_VERSION"

      # Why: garak sends its own requests, so it is pointed at the gated proxy and
      # never at the stub. The example file's window is dated, so a window around now
      # is written into a copy. The stub is the hardened mode, so a clean score is the
      # expected result. The weak mode is not gated here because its flagged counts
      # have only been seen in one run.
      - name: Run garak through the gated proxy
        run: |
          set -euo pipefail
          start=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S+00:00)
          end=$(date -u -d '1 day' +%Y-%m-%dT%H:%M:%S+00:00)
          sed -e "s|^start = .*|start = ${start}|" -e "s|^end = .*|end = ${end}|" \
            examples/roe.stub-local.toml > "$RUNNER_TEMP/roe.garak.toml"
          uv run uvicorn --factory redteam_toolkit.stub_target:hardened_app \
            --host 127.0.0.1 --port 8010 --log-level warning &
          stub_pid=$!
          uv run redteam-toolkit proxy --file "$RUNNER_TEMP/roe.garak.toml" \
            --target stub-hardened-local --suite prompt_injection \
            --audit "$RUNNER_TEMP/garak-audit.jsonl" &
          proxy_pid=$!
          trap 'kill "$stub_pid" "$proxy_pid" 2>/dev/null || true' EXIT
          curl --silent --output /dev/null --retry 30 --retry-connrefused \
            --retry-delay 1 http://127.0.0.1:8010/openapi.json
          curl --silent --output /dev/null --retry 30 --retry-connrefused \
            --retry-delay 1 http://127.0.0.1:8100/query
          mkdir -p "$RUNNER_TEMP/garak"
          "$RUNNER_TEMP/garak-env/bin/python" -m garak \
            --target_type rest \
            --generator_option_file examples/garak.stub-hardened-via-proxy.json \
            --config examples/garak.run-small.yaml \
            --probes encoding.InjectBase64,encoding.InjectROT13,goodside.Tag,latentinjection.LatentInjectionReport,latentinjection.LatentInjectionResume,promptinject.HijackLongPrompt,sysprompt_extraction.SystemPromptExtraction \
            --report_prefix "$RUNNER_TEMP/garak/hardened"
          echo "proxy audit outcomes (count, outcome, status):"
          grep -o '"outcome": "[a-z_]*", "path": "[a-z]*", "status_code": [0-9a-z]*' \
            "$RUNNER_TEMP/garak-audit.jsonl" | sed 's/"path": "[a-z]*", //' | sort | uniq -c

      # Why: the canary is read from the stub's own source, so the two cannot drift.
      - name: Score the garak report
        run: |
          set -euo pipefail
          canary=$(uv run python -c "from redteam_toolkit.stub_target import CANARY; print(CANARY)")
          uv run redteam-toolkit score \
            --report "$RUNNER_TEMP/garak/hardened.report.jsonl" \
            --canary "$canary" --json "$RUNNER_TEMP/garak/summary.json"
